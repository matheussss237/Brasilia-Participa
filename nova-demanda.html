<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova Demanda | Brasília Participa</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a href="index.html" class="logo">

            <span class="logo-icon">
                <i class="fa-solid fa-city"></i>
            </span>

            Brasília Participa

        </a>

        <nav class="nav">

            <a href="index.html">Início</a>

            <a href="demandas.html">Demandas</a>

            <a href="mapa.html">Mapa</a>

            <a href="dashboard.html">Dashboard</a>

        </nav>

        <div class="header-actions">

            <button
                class="icon-btn"
                id="themeButton"
            >
                <i class="fa-solid fa-moon"></i>
            </button>

        </div>

    </div>

</header>


<main class="section">

    <div class="container">

        <div class="page-title">
            Registrar nova demanda
        </div>

        <p class="page-subtitle">
            Conte para a cidade qual problema precisa
            de atenção.
        </p>


        <div class="card form-card">

            <form id="demandForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="title">
                            Título da demanda
                        </label>

                        <input
                            id="title"
                            class="form-control"
                            type="text"
                            placeholder="Ex: Buraco na avenida"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Categoria
                        </label>

                        <select
                            id="category"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option>
                                Infraestrutura
                            </option>

                            <option>
                                Iluminação
                            </option>

                            <option>
                                Limpeza
                            </option>

                            <option>
                                Segurança
                            </option>

                            <option>
                                Transporte
                            </option>

                            <option>
                                Meio ambiente
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="region">
                            Região administrativa
                        </label>

                        <select
                            id="region"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option>
                                Gama
                            </option>

                            <option>
                                Taguatinga
                            </option>

                            <option>
                                Ceilândia
                            </option>

                            <option>
                                Samambaia
                            </option>

                            <option>
                                Plano Piloto
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Localização
                        </label>

                        <input
                            id="location"
                            class="form-control"
                            type="text"
                            placeholder="Rua, avenida ou referência"
                            required
                        >

                    </div>


                    <div class="form-group form-full">

                        <label for="description">
                            Descrição
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="7"
                            placeholder="Descreva detalhadamente o problema..."
                            required
                        ></textarea>

                    </div>


                    <div class="form-group form-full">

                        <label for="photo">
                            Foto da situação
                        </label>

                        <input
                            id="photo"
                            class="form-control"
                            type="file"
                            accept="image/*"
                        >

                    </div>


                    <div class="form-full">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            <i class="fa-solid fa-paper-plane"></i>

                            Enviar demanda

                        </button>

                    </div>


                </div>

            </form>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <p>
            © <span id="currentYear"></span>
            Brasília Participa
        </p>

    </div>

</footer>


<script src="js/main.js"></script>
<script src="js/demandas.js"></script>

</body>

</html>
