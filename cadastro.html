<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | Brasília Participa</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a href="index.html" class="logo">

            <span class="logo-icon">
                <i class="fa-solid fa-city"></i>
            </span>

            Brasília Participa

        </a>

        <div class="header-actions">

            <button
                class="icon-btn"
                id="themeButton"
            >

                <i class="fa-solid fa-moon"></i>

            </button>

        </div>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card scale-in">

        <div class="auth-header">

            <div
                class="logo-icon"
                style="margin: 0 auto 20px;"
            >

                <i class="fa-solid fa-user-plus"></i>

            </div>

            <h1>
                Crie sua conta
            </h1>

            <p>
                Cadastre-se para registrar problemas e acompanhar suas solicitações.
            </p>

        </div>


        <form
            class="auth-form"
            onsubmit="event.preventDefault(); alert('Cadastro realizado com sucesso!'); window.location.href='login.html';"
        >

            <div class="form-group">

                <label for="name">
                    Nome completo
                </label>

                <input
                    id="name"
                    type="text"
                    class="form-control"
                    placeholder="Seu nome"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    placeholder="seu@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    type="password"
                    class="form-control"
                    placeholder="Crie uma senha"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirmar senha
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    class="form-control"
                    placeholder="Digite novamente"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >

                <i class="fa-solid fa-user-plus"></i>

                Criar minha conta

            </button>

        </form>


        <div class="auth-footer">

            Já possui uma conta?

            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>

</main>


<script src="js/main.js"></script>

</body>

</html>
