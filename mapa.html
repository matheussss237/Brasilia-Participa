<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mapa interativo das demandas urbanas registradas no Distrito Federal.">
    <title>Mapa · Brasília Participa</title>
    <link rel="icon" type="image/svg+xml" href="imagens/favicon-verde.svg">
    <script src="js/ui/tema-inicial.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/paginas.css">
</head>
<body data-pagina="mapa">

<main id="conteudo" class="secao">
    <div class="container">

        <header class="titulo-pagina">
            <div>
                <h1>Mapa de demandas</h1>
                <p>Veja onde estão concentrados os problemas da cidade. A cor do pino indica o status e o ícone indica o tipo do problema.</p>
            </div>
        </header>

        <div class="filtros-mapa">
            <div class="grupo-chips" role="group" aria-label="Mostrar status" id="chipsStatus"></div>
            <div class="campo campo--inline">
                <label for="mapaCategoria">Categoria</label>
                <select id="mapaCategoria" class="controle controle--sm">
                    <option value="">Todas</option>
                </select>
            </div>
        </div>

        <div class="layout-mapa">
            <div class="mapa-caixa">
                <div id="mapaDemandas" class="mapa" role="region" aria-label="Mapa de demandas"></div>
                <p class="mapa-contagem" aria-live="polite"><strong id="contagemPinos">0</strong> demandas no mapa</p>
            </div>

            <aside class="card painel-mapa" id="painelMapa" aria-live="polite">
                <div class="estado estado--compacto">
                    <span class="estado__icone" aria-hidden="true"><i class="fa-solid fa-map-location-dot"></i></span>
                    <h3>Selecione um pino</h3>
                    <p>Clique em um marcador no mapa para ver os detalhes da demanda.</p>
                </div>
            </aside>
        </div>

    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data/categorias.js"></script>
<script src="js/data/regioes.js"></script>
<script src="js/data/demandas-seed.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/dominio.js"></script>
<script src="js/core/api.js"></script>
<script src="js/ui/layout.js"></script>
<script src="js/ui/componentes.js"></script>
<script src="js/ui/mapa-base.js"></script>
<script src="js/pages/mapa.js"></script>
</body>
</html>
