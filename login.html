<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Entre na sua conta do Brasília Participa.">
    <title>Entrar · Brasília Participa</title>
    <link rel="icon" type="image/svg+xml" href="imagens/favicon-verde.svg">
    <script src="js/ui/tema-inicial.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/paginas.css">
</head>
<body data-pagina="auth" data-rodape="nao">

<main id="conteudo" class="auth">
    <section class="card auth__cartao" aria-labelledby="tituloAuth">
        <header class="auth__cabecalho">
            <span class="auth__icone" aria-hidden="true"><i class="fa-solid fa-right-to-bracket"></i></span>
            <h1 id="tituloAuth">Entrar no Brasília Participa</h1>
            <p>Acesse sua conta para registrar e acompanhar suas demandas.</p>
        </header>

        <form class="auth__form" id="formAuth" data-modo="entrar" novalidate>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" class="controle" autocomplete="email" placeholder="seu@email.com" required aria-describedby="emailErro">
                <p class="erro" id="emailErro" data-erro="email"></p>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-senha">
                    <input id="senha" name="senha" type="password" class="controle" autocomplete="current-password" placeholder="Sua senha" required aria-describedby="senhaErro">
                    <button type="button" class="icone-btn icone-btn--sm" data-mostrar-senha="senha" aria-label="Mostrar senha"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
                </div>
                <p class="erro" id="senhaErro" data-erro="senha"></p>
            </div>
            <button type="submit" class="btn btn--primario btn--bloco">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>Entrar
            </button>
        </form>

        <p class="auth__rodape">Ainda não tem conta? <a href="cadastro.html" data-manter-proximo>Criar conta</a></p>
        <p class="auth__aviso"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>Protótipo: as contas ficam salvas apenas neste navegador.</p>
    </section>
</main>

<script src="js/data/categorias.js"></script>
<script src="js/data/regioes.js"></script>
<script src="js/data/demandas-seed.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/dominio.js"></script>
<script src="js/core/api.js"></script>
<script src="js/ui/layout.js"></script>
<script src="js/ui/componentes.js"></script>
<script src="js/pages/auth.js"></script>
</body>
</html>
