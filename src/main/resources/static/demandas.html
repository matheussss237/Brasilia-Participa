
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Demandas | Brasília Participa</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="imagens/favicon-verde.svg">


    <link
        rel="stylesheet"
        href="vendor/fontawesome/css/all.min.css"
    >

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="gov-topbar">
    <div class="container gov-topbar-content">
        <span><i class="fa-solid fa-landmark"></i> Governo de Brasília</span>
        <span>Portal de Participação Cidadã</span>
    </div>
</div>

<header class="header">

    <div class="container header-content">

        <a href="index.html" class="logo">

            <span class="logo-icon">
                <i class="fa-solid fa-city"></i>
            </span>

            Brasília Participa

        </a>

        <nav class="nav">

            <a href="index.html">
                Início
            </a>

            <a
                href="demandas.html"
                class="active"
            >
                Demandas
            </a>

            <a href="mapa.html">
                Mapa
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </nav>

        <form
            class="header-search"
            role="search"
            action="demandas.html"
            method="get"
        >
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                name="q"
                placeholder="Pesquisar demandas..."
                aria-label="Pesquisar demandas"
            >
        </form>

        <div class="header-actions">

            <a
                href="nova-demanda.html"
                class="btn btn-primary"
            >
                <i class="fa-solid fa-plus"></i>
                Nova demanda
            </a>

            <button
                class="icon-btn"
                id="themeButton"
            >
                <i class="fa-solid fa-moon"></i>
            </button>

        </div>

    </div>

</header>


<main class="section">

    <div class="container">

        <div class="page-title">
            Demandas da população
        </div>

        <p class="page-subtitle">
            Confira as demandas registradas pelos moradores de Brasília.
        </p>


        <!-- FILTROS (aplicados no servidor) -->
        <div class="filters" role="search">
            <input
                type="search"
                id="searchDemand"
                class="form-control filter-input"
                placeholder="Pesquisar por título, descrição ou local..."
                aria-label="Pesquisar demandas"
            >

            <select id="statusFilter" class="form-control" aria-label="Filtrar por status">
                <option value="">Todos os status</option>
            </select>

            <select id="categoryFilter" class="form-control" aria-label="Filtrar por categoria">
                <option value="">Todas as categorias</option>
            </select>

            <select id="regionFilter" class="form-control" aria-label="Filtrar por região">
                <option value="">Todas as regiões</option>
            </select>

            <select id="sortFilter" class="form-control" aria-label="Ordenar">
                <option value="recentes">Mais recentes</option>
                <option value="apoios">Mais apoiadas</option>
                <option value="antigas">Mais antigas</option>
            </select>
        </div>

        <div class="list-toolbar">
            <span id="demandsCount" class="list-count" aria-live="polite"></span>
            <button type="button" id="clearFilters" class="link-button">
                <i class="fa-solid fa-filter-circle-xmark"></i> Limpar filtros
            </button>
            <a href="nova-demanda.html" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Registrar demanda
            </a>
        </div>

        <!-- DEMANDAS -->
        <div class="demands-grid" id="demandsContainer">
            <!-- Preenchido por js/demandas.js com dados da API -->
        </div>

        <div class="load-more">
            <button type="button" id="loadMoreButton" class="btn btn-secondary" hidden>
                Carregar mais demandas
            </button>
        </div>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <p>
            © <span id="currentYear"></span>
            Brasília Participa
        </p>

        <p>
            Sua voz transforma Brasília.
        </p>

    </div>

</footer>


<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/toast.js"></script>
<script src="js/main.js"></script>
<script src="js/demandas.js"></script>

</body>

</html>
