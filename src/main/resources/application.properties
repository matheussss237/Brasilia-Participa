# =========================================================
#  Brasília Participa - configurações
# =========================================================
spring.application.name=brasilia-participa

# Porta do servidor: http://localhost:8080
server.port=${PORT:8080}

# ---------------- MongoDB ----------------
# Local (MongoDB instalado no PC ou via docker compose):
#   mongodb://localhost:27017/brasilia_participa
# MongoDB Atlas (nuvem): defina a variável de ambiente MONGODB_URI
#   com a string de conexão que o Atlas mostra em "Connect".
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/brasilia_participa}
# Cria os índices declarados com @Indexed nas classes do pacote model
spring.data.mongodb.auto-index-creation=true

# ---------------- Upload de fotos ----------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------- Sessão de login ----------------
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------------- Dados iniciais ----------------
# Na primeira execução (banco vazio) o sistema cria as demandas de exemplo
# e os usuários abaixo. Troque as senhas antes de colocar no ar!
app.dados-iniciais.ativo=true
app.dados-iniciais.admin-email=${ADMIN_EMAIL:admin@brasiliaparticipa.df.gov.br}
app.dados-iniciais.admin-senha=${ADMIN_SENHA:admin123}
app.dados-iniciais.cidadao-email=cidadao@email.com
app.dados-iniciais.cidadao-senha=cidadao123

# ---------------- Documentação da API ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
