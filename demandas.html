<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Confira, filtre e apoie as demandas urbanas registradas pelos moradores do Distrito Federal.">
    <title>Demandas · Brasília Participa</title>
    <link rel="icon" type="image/svg+xml" href="imagens/favicon-verde.svg">
    <script src="js/ui/tema-inicial.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/paginas.css">
</head>
<body data-pagina="demandas">

<main id="conteudo" class="secao">
    <div class="container">

        <header class="titulo-pagina">
            <div>
                <h1>Demandas da população</h1>
                <p>Confira as demandas registradas pelos moradores, filtre por região ou categoria e apoie as causas que importam para você.</p>
            </div>
            <a href="nova-demanda.html" class="btn btn--primario"><i class="fa-solid fa-plus" aria-hidden="true"></i>Nova demanda</a>
        </header>

        <form class="filtros card" id="filtros" role="search" aria-label="Filtrar demandas">
            <div class="campo campo--busca">
                <label for="filtroBusca">Buscar</label>
                <div class="campo__icone">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" id="filtroBusca" name="q" class="controle" placeholder="Título, local, região...">
                </div>
            </div>
            <div class="campo">
                <label for="filtroStatus">Status</label>
                <select id="filtroStatus" name="status" class="controle">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtroCategoria">Categoria</label>
                <select id="filtroCategoria" name="categoria" class="controle">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtroRegiao">Região</label>
                <select id="filtroRegiao" name="regiao" class="controle">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtroOrdem">Ordenar por</label>
                <select id="filtroOrdem" name="ordem" class="controle">
                    <option value="recentes">Mais recentes</option>
                    <option value="apoiadas">Mais apoiadas</option>
                    <option value="antigas">Mais antigas</option>
                </select>
            </div>
        </form>

        <div class="barra-resultado">
            <p id="contagemResultado" aria-live="polite">Carregando…</p>
            <button type="button" class="btn btn--texto btn--sm" id="limparFiltros" hidden>
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>Limpar filtros
            </button>
        </div>

        <div class="grade-demandas" id="listaDemandas"></div>

        <div class="centro">
            <button type="button" class="btn btn--secundario" id="carregarMais" hidden>Carregar mais demandas</button>
        </div>

    </div>
</main>

<script src="js/data/categorias.js"></script>
<script src="js/data/regioes.js"></script>
<script src="js/data/demandas-seed.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/dominio.js"></script>
<script src="js/core/api.js"></script>
<script src="js/ui/layout.js"></script>
<script src="js/ui/componentes.js"></script>
<script src="js/pages/demandas.js"></script>
</body>
</html>
